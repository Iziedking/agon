# Production backend stack for the VPS. The frontend is hosted on Vercel and
# is not part of this file. Caddy terminates TLS for the api and ws
# subdomains; Postgres and Redis stay on the internal Docker network with no
# host ports. Secrets come from deploy/.env (gitignored, created once on the
# host). See deploy.md for first-time setup and the backup/recovery runbook.
#
# The GitHub Actions deploy job runs, over SSH on the VPS:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# Resource caps are sized for a 2-core / 8GB host. They use the top-level
# mem_limit/cpus keys, which `docker compose up` enforces (the deploy.resources
# block is ignored outside Swarm, so it is not used here). cpus is a ceiling,
# not a reservation: it only bites under contention, and it stops the
# coordinator from grabbing both cores during a settlement wave so Postgres
# always has a core. Always-on memory limits total ~5.7GB, leaving headroom for
# the host and the transient migrate job. Adjust if you move to a bigger box.

x-backend: &backend
  build:
    context: ../backend
    dockerfile: Dockerfile
  image: arcrun-backend:prod
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://arcrun:${POSTGRES_PASSWORD}@postgres:5432/arcrun
    REDIS_URL: redis://redis:6379
  volumes:
    - ../contracts/deployments:/app/contracts/deployments:ro
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: arcrun-postgres
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 768m
    cpus: 1.0
    environment:
      POSTGRES_USER: arcrun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: arcrun
    volumes:
      - arcrun_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcrun -d arcrun"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arcrun-redis
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    volumes:
      - arcrun_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend
    container_name: arcrun-migrate
    command: npm run migrate
    restart: "no"
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy

  indexer:
    <<: *backend
    container_name: arcrun-indexer
    command: npm run indexer
    mem_limit: 768m
    mem_reservation: 192m
    cpus: 0.75
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  auth:
    <<: *backend
    container_name: arcrun-auth
    command: npm run auth
    mem_limit: 768m
    mem_reservation: 192m
    cpus: 0.75
    expose:
      - "8082"
      - "8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  coordinator:
    <<: *backend
    container_name: arcrun-coordinator
    command: npm run coordinator
    mem_limit: 1536m
    mem_reservation: 384m
    cpus: 1.0
    expose:
      - "8788"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    container_name: arcrun-caddy
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The DIRECTORY, not the file. A single-file bind mount pins one inode,
      # and the deploy's `git reset --hard` replaces the file rather than
      # writing into it, so the container keeps serving the config it started
      # with and `caddy reload` re-reads that same stale copy. Mounting the
      # directory makes the name resolve on every read, so a redeployed
      # Caddyfile is actually seen. See deploy/caddy/Caddyfile for the story.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - auth
      - coordinator

volumes:
  arcrun_pgdata:
  arcrun_redisdata:
  caddy_data:
  caddy_config:
