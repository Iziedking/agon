services:
  postgres:
    image: postgres:16-alpine
    container_name: arcrun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arcrun
      POSTGRES_PASSWORD: arcrun
      POSTGRES_DB: arcrun
    ports:
      - "5434:5432"
    volumes:
      - arcrun_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcrun -d arcrun"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arcrun-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - arcrun_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arcrun_pgdata:
  arcrun_redisdata:
