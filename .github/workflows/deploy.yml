name: deploy backend

# Frontend deploys are handled by Vercel's own GitHub integration. This
# workflow owns the backend: it type-checks, then redeploys the VPS stack
# over SSH. It runs only when something the backend cares about changes.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "contracts/deployments/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Type-check backend
        working-directory: backend
        run: npm run typecheck

  deploy:
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      # Skip the deploy until the VPS secrets exist, so pushes stay green
      # before the server is provisioned. Configuring VPS_HOST (see
      # first_deploy.md) enables this automatically with no workflow change.
      - name: Check VPS is configured
        id: gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "VPS secrets not set yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy stack on the VPS
        if: steps.gate.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/arcrun
            git fetch --all --prune
            git reset --hard origin/main
            git submodule update --init --recursive
            docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build --remove-orphans
            # Caddy does not watch its config and `up -d` does not restart it
            # when only the mounted config changed, so without this the reset
            # above silently keeps serving the previous routing. That matters
            # beyond arcrun, because agentsqa.xyz and api.avow.site are proxied
            # from that same file. This only works because the compose file
            # mounts deploy/caddy as a DIRECTORY: with a single-file mount the
            # container would re-read a pinned, stale inode and the reload would
            # be a no-op. Validate before reloading so a bad edit fails the
            # deploy loudly instead of leaving Caddy on stale config.
            docker exec arcrun-caddy caddy validate --config /etc/caddy/Caddyfile
            docker exec arcrun-caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -f
