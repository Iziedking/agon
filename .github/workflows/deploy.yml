name: AGON production

# Vercel's Git integration owns the frontend. This pipeline tests both apps
# and releases Arc + BNB APIs from the SAME main commit.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "bnb-market/**"
      - "frontend/**"
      - "contracts/deployments/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: agon-production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://nock:nock@127.0.0.1:15432/nock
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nock
          POSTGRES_PASSWORD: nock
          POSTGRES_DB: nock
        ports: ["15432:5432"]
        options: --health-cmd "pg_isready -U nock" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm install --prefix backend --no-audit --no-fund
          npm ci --prefix bnb-market --ignore-scripts --no-audit --no-fund
          npm ci --prefix frontend --no-audit --no-fund
      - name: Check backend and BNB boundaries
        run: |
          npm run typecheck --prefix backend
          npm run test:agon --prefix backend
          npm run test --prefix bnb-market
          npm run test:boundaries --prefix bnb-market
          npm run test:commerce --prefix bnb-market
          npm run test:lp-agent --prefix bnb-market
          npm run test:transport --prefix bnb-market
          npm run test:auth --prefix bnb-market -- --local-db
          npm run test:lp-storage --prefix bnb-market
          npm run test:marketplace --prefix frontend
          python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Build both applications
        run: |
          npm run build --prefix bnb-market
          npm run build --prefix frontend
      - name: Build immutable backend images
        if: github.event_name != 'pull_request'
        run: |
          docker build -t agon-arc-api:${{ github.sha }} backend
          docker build -f bnb-market/Dockerfile.api -t agon-bnb-api:${{ github.sha }} bnb-market
          mkdir -p bundle/contracts
          docker save agon-arc-api:${{ github.sha }} agon-bnb-api:${{ github.sha }} | gzip > bundle/images.tar.gz
          cp deploy/release.compose.yml deploy/caddy/Caddyfile bundle/
          cp -R contracts/deployments bundle/contracts/
          cd bundle
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: agon-release-${{ github.sha }}
          path: bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        id: gate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No VPS configured; tests passed, production was NOT deployed." >> "$GITHUB_STEP_SUMMARY"
          else
            test -n "$VPS_USER" && test -n "$VPS_KEY" && test -n "$VPS_FINGERPRINT" || { echo "Incomplete VPS configuration"; exit 1; }
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.gate.outputs.ready == 'true'
        with:
          name: agon-release-${{ github.sha }}
          path: bundle
      - uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        if: steps.gate.outputs.ready == 'true'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          source: bundle/*
          target: /opt/agon-ci/incoming/${{ github.sha }}
          strip_components: 1
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        if: steps.gate.outputs.ready == 'true'
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 15m
          script: sudo -n /usr/local/sbin/agon-deploy ${{ github.sha }}
